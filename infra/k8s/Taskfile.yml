version: '3'
tasks:
  default:
    cmds:
    - task -l
    silent: true
  deploy_meta_server:
    desc: Deploy meta-secret server
    cmds:
    - task: generate_meta_server_deployment_yaml
    - kubectl apply -f meta-secret-server/build/meta-server.yaml
  generate_meta_server_deployment_yaml:
    desc: Validate Apple env and render current KCL before any apply
    cmds:
    - python3 ../apple/apple_infra.py render-process
