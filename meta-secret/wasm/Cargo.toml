[package]
name = "meta-secret-wasm"
version = "2.0.0"
authors = ["cypherkitty <bynull@meta-secret.org>"]
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
mobile = []
default = ["console_error_panic_hook"]

[dependencies]
meta-secret-core = { path = "../core" }
meta-server-node = { path = "../meta-server/server-node" }
meta-db-redb = { path = "../db/redb" }
secrecy = "0.10.3"

anyhow.workspace = true

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true

tracing.workspace = true
tracing-subscriber = { workspace = true, default-features = false, features = ["fmt", "ansi", "time"] }

# Add explicit uuid dependency for wasm
uuid.workspace = true

# Wasm dependencies
tracing-web = "0.1.3"

wasm-bindgen = { version = "0.2.125", features = ["serde-serialize"] }
rexie = "0.6.2"

serde-wasm-bindgen = "0.6.5"
wasm-bindgen-futures = "0.4.75"
time = { version = "0.3.49", features = ["wasm-bindgen"] }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }

[dev-dependencies]
async-lock.workspace = true
async-std.workspace = true
futures-lite = "2.6.0"
wasm-bindgen-test = "0.3.75"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
meta-secret-core = { path = "../core", features = ["test-framework"] }
meta-db-sqlite = { path = "../db/sqlite" }
tempfile = "=3.27.0"
mobile-common = { path = "../mobile/common" }
mobile-uniffi = { path = "../mobile/uniffi" }
tokio.workspace = true
axum.workspace = true
hyper = { version = "=1.8.1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio", "service"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
meta-secret-core = { path = "../core" }
# getrandom 0.2 (pulled in by transitive deps) requires the "js" feature on wasm32-unknown-unknown
getrandom = { version = "0.2", features = ["js"] }
