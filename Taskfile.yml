version: "3"

# Agent/CI entry point for Docker builds — see .ai/skills/build-via-task/SKILL.md
# Never run docker buildx bake|build directly; use: task <target>

tasks:
  android-native-coverage:
    desc: Measure focused verifier fixtures with stdlib trace (optional cover directory after --)
    vars:
      COVER_DIR: '{{default ".ai/artifacts/run/android-native-coverage" .CLI_ARGS}}'
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    cmds:
      - python3 -m trace --count --summary --missing --coverdir "{{.COVER_DIR}}" --module unittest discover -s meta-secret/mobile/scripts -p 'test_verify_android_native.py'

  android-native-build:
    desc: Build existing Android native libraries and generate Compose bindings
    cmds:
      - bash meta-secret/mobile/scripts/build-android.sh

  android-native-verify:
    desc: Inspect native artifact (use -- --role app|instrumentation APK or --abi ABI ELF)
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    cmds:
      - python3 meta-secret/mobile/scripts/verify-android-native.py {{.CLI_ARGS}}

  android-native-test:
    desc: Test Android native ELF and APK layout verifier without SDK builds
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    cmds:
      - python3 -m unittest discover -s meta-secret/mobile/scripts -p 'test_verify_android_native.py' -v

  apple-infra-test:
    desc: Test Apple infrastructure locally without remote effects
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    cmds:
      - python3 -m unittest discover -s infra/apple -p 'test_*.py' -v

  apple-config-check:
    desc: Validate explicit Apple public profile (default disabled)
    cmds:
      - python3 infra/apple/apple_infra.py check

  apple-prepare:
    desc: Write ignored Apple-only exports and optional local tunnel config
    cmds:
      - python3 infra/apple/apple_infra.py prepare

  apple-render:
    desc: Render production/disabled Kubernetes manifest locally with KCL
    cmds:
      - python3 infra/apple/apple_infra.py render

  apple-tunnel-check:
    desc: Check real Cloudflared ingress and KCL offline (no connector/deploy)
    cmds:
      - python3 infra/apple/apple_infra.py verify

  apple-local-server:
    desc: Explicitly run existing local server with owned migrated SQLite
    cmds:
      - python3 infra/apple/apple_infra.py local-run

  apple-local-smoke:
    desc: Bounded real owned SQLite/server/broker smoke on free port3000
    cmds:
      - python3 infra/apple/apple_infra.py local-smoke

  apple-infra-syntax:
    desc: Check infrastructure Python and root wrapper syntax without builds
    cmds:
      - python3 -c "from pathlib import Path; [compile(p.read_text(), str(p), 'exec') for p in Path('infra/apple').glob('*.py')]"
      - bash -n ../scripts/deploy-server.sh

  apple-infra-coverage:
    desc: Measure Python helper statements with stdlib trace (no Rust/branch metric)
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    cmds:
      - python3 -m trace --count --missing --summary --coverdir infra/.apple/coverage --ignore-module importlib,encodings,unittest --module unittest discover -s infra/apple -p 'test_*.py'

  apple-taskomatic-offline:
    desc: Verify fresh taskomatic Task/helper/KCL disabled and synthetic env offline
    cmds:
      - docker run --rm --pull never --network none localhost/taskomatic:latest k8s:generate_meta_server_deployment_yaml
      - docker run --rm --pull never --network none -e APPLE_EMAIL_SERVICE_ID=org.example.infra-image-check -e APPLE_EMAIL_CALLBACK_URL=https://api.meta-secret.org/apple/callback -e APPLE_EMAIL_WEB_ORIGINS=https://meta-secret.github.io localhost/taskomatic:latest k8s:generate_meta_server_deployment_yaml

  default:
    cmds:
      - task -l
    silent: true

  # ============================================================
  # Docker Bake
  # ============================================================

  build:
    desc: Build and load default images (meta-server, web)
    cmds:
      - docker buildx bake --load default

  push:
    desc: Build and push default images to registry
    cmds:
      - docker buildx bake --push default

  warm-cache:
    desc: Build and push builder-debug:cache deps image (CI)
    cmds:
      - task: bake-push
        vars:
          TARGET: builder-debug-cache

  test-run:
    desc: Run tests (after builder-debug-cache, or bake test-ci)
    cmds:
      - docker buildx bake test

  test:
    desc: Push deps image, compile and run tests (one bake; --push in CI)
    cmds:
      - task: bake-push
        vars:
          TARGET: test-ci

  warm-cache-wasm:
    desc: Build and push builder-wasm:cache deps image (CI)
    cmds:
      - task: bake-push
        vars:
          TARGET: builder-wasm-cache

  web-build-local:
    desc: Build web dist only (prefer task web-local / bake web-preview)
    cmds:
      - docker buildx bake web-local

  web-local:
    desc: Push wasm deps image, build web dist (one bake; --push in CI)
    cmds:
      - task: bake-push
        vars:
          TARGET: web-preview

  wasm-local:
    desc: Push wasm deps image, extract pkg (one bake; --push in CI)
    cmds:
      - task: bake-push
        vars:
          TARGET: wasm-pkg

  bake-push:
    internal: true
    vars:
      TARGET: '{{.TARGET}}'
    cmds:
      - |
        if [ -n "${PUSH_CACHE:-}" ]; then
          docker buildx bake --push {{.TARGET}}
        else
          docker buildx bake {{.TARGET}}
        fi

  meta-server:
    desc: Build and load meta-server image
    cmds:
      - docker buildx bake --load meta-server-image

  meta-server-push:
    desc: Build and push only meta-server (requires explicit deployment authorization)
    cmds:
      - docker buildx bake --push meta-server-image

  web:
    desc: Build and load web image
    cmds:
      - docker buildx bake --load web-image

  generate-recipe:
    desc: Regenerate meta-secret/recipe.json via cargo-chef
    cmds:
      - docker buildx bake generate-recipe

  web-run:
    desc: Build web image and run dev server on :5173
    cmds:
      - task: web
      - docker run --rm -p 5173:5173 cypherkitty/meta-secret-web:latest bun run dev -- --host 0.0.0.0

  taskomatic:
    desc: Build and load taskomatic image
    cmds:
      - docker buildx bake --load taskomatic

  taskomatic-run:
    desc: Build and run taskomatic container
    cmds:
      - task: taskomatic
      - docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v $HOME/.kube:/root/.kube
          -v $HOME/.config/k3d:/root/.config/k3d
          --name taskomatic
          --workdir /taskomatic
          localhost/taskomatic:latest

  sops:
    desc: Build and load sops image
    cmds:
      - docker buildx bake --load sops

  # ============================================================
  # Local dev
  # ============================================================

  rust-build-release:
    desc: Build the full native Rust workspace for the workflow build gate
    dir: meta-secret
    cmds:
      - cargo build --release

  rust-clippy:
    desc: Check every Rust workspace target with warnings denied
    dir: meta-secret
    cmds:
      - cargo clippy --all-targets -- -D warnings

  rust-coverage:
    desc: Verify Rust coverage with the workflow's 80 percent threshold
    dir: meta-secret
    env:
      RUST_MIN_STACK: "33554432"
    cmds:
      - cargo tarpaulin --skip-clean --out Html --timeout 300 --fail-under 80

  rust-test:
    desc: Run all regular Rust workspace tests locally
    dir: meta-secret
    env:
      RUST_MIN_STACK: "33554432"
    cmds:
      - cargo test --all

  set-env:
    desc: "Switch MetaSecret clients between local and remote servers (usage: task set-env -- local|remote)"
    cmds:
      - ./scripts/set-meta-secret-env.sh {{.CLI_ARGS}}

  wasm-test:
    desc: Run WASM tests in Firefox
    dir: meta-secret/wasm
    cmds:
      - wasm-pack test --firefox

  wasm-test-headless:
    desc: Run WASM tests headless in Firefox
    dir: meta-secret/wasm
    cmds:
      - wasm-pack test --headless --firefox
